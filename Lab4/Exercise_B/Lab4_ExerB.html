<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Café Campus</title>
    
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="cafe.css">

    <!-- Internal CSS -->
    <style>
        h1 {
            text-decoration: overline;
        }
        p {
            color: #333333;
            text-align: justify;
        }
        #intro {
            font-size: 18px;
            background-color: #FDEBD0;
        }
        .highlight {
            font-weight: bold;
            color: #C0392B;
        }
    </style>
</head>
<body>

   <!-- 
    Error 1 (Line 1): Entire HTML document was pasted twice (removed duplicate second copy).
    Error 2 (Line 7): HTML comment  used inside <style> tag (must use CSS comment /* ... */).
    Error 3 (Line 9): Invalid property value list-style-type: no; (corrected to list-style-type: none;).
    Error 4 (Line 13-16): Link states in wrong order (:hover placed before :visited; corrected to link -> visited -> hover -> active).
    Error 5 (Line 17): Invalid property value text-decoration: overlined; (corrected to text-decoration: overline;).
    Error 6 (Line 18): Missing colon after color property in p {color #333333; (corrected to color: #333333;).
    Error 7 (Line 22): Missing dot prefix for class selector highlight (corrected to .highlight).
    Error 8 (Line 56): Broken section link href="menu" (corrected to href="#menu").
    Error 9 (Line 63): Selector mismatch: HTML uses class="intro" while CSS defines ID #intro (corrected to id="intro").
    Error 10 (Line 64 & 68): Duplicate id="item" used on two <article> elements (corrected to class="item").
    Error 11 (Line 75): Missing controls attribute in <video> tag so the video cannot be played (added controls).
    Error 12 (Line 76): Invalid MIME type type="mp4" in <source> tag (corrected to type="video/mp4").
  -->

    <!-- Header section -->
    <header>
        <h1>e-Café Campus</h1>
    </header>

    <!-- Navigation bar -->
    <nav>
        <ul>
            <li><a href="#menu">Menu</a></li>
            <li><a href="#video">Video</a></li>
            <li><a href="#feedback">Feedback</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Menu section -->
    <section id="menu">
        <h2>Today's Menu</h2>
        <p id="intro">Freshly brewed coffee and local delights every day.</p>
        
        <!-- Menu item 1 -->
        <article class="item">
            <h3>Kopi Tarik</h3>
            <p>Only <span class="old-price">RM 4.50</span> <span class="highlight">RM 3.50</span></p>
        </article>

        <!-- Menu item 2 -->
        <article class="item">
            <h3>Nasi Lemak</h3>
            <p>Only <span class="old-price">RM 6.50</span> <span class="highlight">RM 5.00</span></p>
        </article>
    </section>

    <!-- Video section -->
    <section id="video">
        <h2>Watch Our Story</h2>
        <figure>
            <video width="400" height="300" controls>
                <source src="cafe.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <figcaption>Figure 1: Discover how e-Café Campus prepares fresh coffee and meals daily.</figcaption>
        </figure>
    </section>

    <!-- Feedback form section -->
    <section id="feedback">
        <h2>Customer Feedback</h2>
        <form class="feedback-form" action="#" method="post">
            <!-- Name and Email -->
            <label for="fb-name">Name:</label>
            <input type="text" id="fb-name" name="name" required>

            <label for="fb-email">E-mail:</label>
            <input type="email" id="fb-email" name="email" required>

            <!-- Visit type radio buttons -->
            <label>Visit Type:</label>
            <div>
                <input type="radio" id="dine-in" name="visit_type" value="Dine-in" checked>
                <label for="dine-in" class="inline-label">Dine-in</label>
                <input type="radio" id="take-away" name="visit_type" value="Take-away">
                <label for="take-away" class="inline-label">Take-away</label>
            </div>

            <!-- Favourite items checkboxes -->
            <label>Favourite Items:</label>
            <div>
                <input type="checkbox" id="fav-kopi" name="fav_item" value="Kopi Tarik">
                <label for="fav-kopi" class="inline-label">Kopi Tarik</label><br>
                <input type="checkbox" id="fav-nasi" name="fav_item" value="Nasi Lemak">
                <label for="fav-nasi" class="inline-label">Nasi Lemak</label><br>
                <input type="checkbox" id="fav-teh" name="fav_item" value="Teh O Ais">
                <label for="fav-teh" class="inline-label">Teh O Ais</label>
            </div>

            <!-- Submit button -->
            <input type="submit" value="Submit Feedback">
        </form>
    </section>

    <!-- Footer section -->
    <footer id="contact">
        <p>&copy; 2026 e-Café Campus</p>
        <address>
            Contact us: <a href="mailto:ecafe@campus.edu.my">ecafe@campus.edu.my</a>
        </address>
    </footer>

</body>
</html>
